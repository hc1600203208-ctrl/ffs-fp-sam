foundationpose_stereo_tracker_node:
  ros__parameters:
    left_image_topic: /left/image_raw
    right_image_topic: /right/image_raw
    image_reliability: 1
    sync_queue_size: 10
    max_sync_interval_sec: 0.07

    stereo_model_type: FAST_FOUNDATION_STEREO
    stereo_engine_file_path:
      - /home/hc/weizi/ffs+fp+sam/ffs/model/feature_runner_fp16_5060.engine
      - /home/hc/weizi/ffs+fp+sam/ffs/model/post_runner_fp16_5060.engine
    model_input_width: 640
    model_input_height: 448
    min_depth_meters: 0.1
    max_depth_meters: 100.0
    use_filtered_depth_for_pose: false
    caminfo_path: /home/hc/weizi/ffs+fp+sam/ffs/jrnew.txt

    refiner_engine_path: /home/hc/weizi/ffs+fp+sam/fp/models/refiner_hwc_dynamic_fp16_5060.engine
    scorer_engine_path: /home/hc/weizi/ffs+fp+sam/fp/models/scorer_hwc_dynamic_fp16_5060.engine
    mesh_path: /home/hc/weizi/dataset/jrnew-blue/mesh/textured_mesh.obj
    object_name: blue carton

    mask_image_path: ""
    mask_image_directory: /home/hc/weizi/ffs+fp+sam/Grounded-Segment-Anything/ros2_outputs/first_mask
    mask_image_name: first_mask.png
    resize_mask_to_input: false
    mask_poll_interval_ms: 200

    pose_topic: /foundationpose/pose
    pose_frame_id: camera_color_optical_frame
    visualization_topic: /foundationpose/visualization
    visualization_window_name: foundationpose_visualization
    publish_visualization: false
    show_visualization_window: true

    fx: 736.0934
    fy: 736.6856
    cx: 989.8375
    cy: 551.6085
    max_input_image_height: 1080
    max_input_image_width: 1920
    register_refine_iterations: 5
    track_refine_iterations: 2

    pose_filter:
      default_dt: 0.03333333333333333
      q_pos: 0.0001
      q_rot: 0.0001
      q_vel: 0.001
      q_omega: 0.001
      sigma_pos_obs: 0.01
      sigma_rot_obs: 0.05
      sigma_pos_motion: 0.05
      sigma_rot_motion: 0.35
      min_quality: 0.01
      gate_threshold: 16.81
      reject_cov_increase: 0.0001
      enable_gating: true
      enable_adaptive_R: true
