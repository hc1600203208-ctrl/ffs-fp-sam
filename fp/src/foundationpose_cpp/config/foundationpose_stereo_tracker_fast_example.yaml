foundationpose_stereo_tracker_fast_node:
  ros__parameters:
    left_image_topic: /left/image_raw
    right_image_topic: /right/image_raw
    image_reliability: 1
    sync_queue_size: 10
    max_sync_interval_sec: 0.07

    stereo_model_type: FAST_FOUNDATION_STEREO
    stereo_engine_file_path:
      - /home/hc/model/ffs/23-36-37/feature_runner_fp16_5060.engine
      - /home/hc/model/ffs/23-36-37/post_runner_fp16_5060.engine
    model_input_width: 640
    model_input_height: 448
    min_depth_meters: 0.1
    max_depth_meters: 100.0
    caminfo_path: /home/hc/weizi/ffs+fp+sam/ffs/640.txt

    refiner_engine_path: /home/hc/weizi/ffs+fp+sam/fp/models/refiner_hwc_dynamic_fp16_5060.engine
    scorer_engine_path: /home/hc/weizi/ffs+fp+sam/fp/models/scorer_hwc_dynamic_fp16_5060.engine
    mesh_path: /home/hc/dataset/myobject/weixing1/weixing_mesh/textured_mesh.obj
    # mesh_path: /home/hc/dataset/myobject/lgj/bundlesdf_540/textured_mesh.obj
    object_name: golden object
    # object_name: pink carton

    mask_image_path: ""
    mask_image_directory: /home/hc/weizi/ffs+fp+sam/Grounded-Segment-Anything/ros2_outputs/first_mask
    mask_image_name: first_mask.png
    resize_mask_to_input: false
    mask_poll_interval_ms: 200

    pose_topic: /foundationpose/pose
    pose_frame_id: camera_color_optical_frame
    visualization_topic: /foundationpose/visualization
    visualization_window_name: foundationpose_visualization
    publish_visualization: false
    show_visualization_window: true
    save_frame_outputs: false
    frame_output_dir: /home/hc/weizi/ffs+fp+sam/fp/stereo_tracker_fast_outputs
    filter_fps: 20.0
    filter_q_pos: 0.0001
    filter_q_rot: 0.001
    filter_q_vel: 0.01
    filter_q_omega: 0.1
    filter_sigma_pos_obs: 0.005
    filter_sigma_rot_obs: 0.02
    filter_sigma_pos_motion: 0.05
    filter_sigma_rot_motion: 0.7
    filter_min_quality: 0.01
    filter_gate_threshold: 100.0
    filter_reject_cov_increase: 0.0001
    filter_enable_gating: true
    filter_enable_adaptive_R: true

    # fx: 327.1586
    # fy: 326.8882
    # cx: 334.2443
    # cy: 246.0753
    fx: 326.950601615584
    fy: 327.041140739760
    cx: 336.128121348489
    cy: 244.754661442305
    max_input_image_height: 480
    max_input_image_width: 640
    register_refine_iterations: 5
    track_refine_iterations: 2
